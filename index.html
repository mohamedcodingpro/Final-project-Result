<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Result Summary</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="card">
        <div class="result-section">
            <h2 class="result-title">Your Result</h2>
            <div class="score-circle">
                <span class="score">76</span>
                <span class="total-score">of 100</span>
            </div>
            <h3 class="rating">Great</h3>
            <p class="description">You scored higher than 65% of the people who have taken these tests.</p>
        </div>
        
        <div class="summary-section">
            <h2 class="summary-title">Summary</h2>
            
            <div class="category reaction">
                <div class="category-name">
                    <img src="assets/images/icon-reaction.svg" alt="Reaction icon">
                    Reaction
                </div>
                <div class="category-score">80 <span>/ 100</span></div>
            </div>
            
            <div class="category memory">
                <div class="category-name">
                    <img src="assets/images/icon-memory.svg" alt="Memory icon">
                    Memory
                </div>
                <div class="category-score">92 <span>/ 100</span></div>
            </div>
            
            <div class="category verbal">
                <div class="category-name">
                    <img src="assets/images/icon-verbal.svg" alt="Verbal icon">
                    Verbal
                </div>
                <div class="category-score">61 <span>/ 100</span></div>
            </div>
            
            <div class="category visual">
                <div class="category-name">
                    <img src="assets/images/icon-visual.svg" alt="Visual icon">
                    Visual
                </div>
                <div class="category-score">73 <span>/ 100</span></div>
            </div>
            
            <button class="continue-btn">Continue</button>
        </div>
    </div>
</body>
</html>
